<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ورود/ثبت‌نام شیشه‌ای</title>
    <!-- فونت وزیرمتن برای نمایش بهتر فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikdizaj/Vazirmatn/Vazirmatn.css" rel="stylesheet">
    <style>
        /* 1. تنظیمات اصلی و بک‌گراند (Navy Blue Gradient) */
        :root {
            --navy-dark: #001f3f; /* آبی نفتی تیره */
            --navy-medium: #003366; /* آبی نفتی متوسط */
            --glow-color: #4c9aff; /* آبی روشن برای هایلایت */
            --text-color: #333;
            --font-family: 'Vazirmatn', sans-serif;
        }

        body {
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-medium) 100%);
            color: var(--text-color);
            overflow: hidden; /* برای جلوگیری از اسکرول اضافی */
        }

        /* 2. افکت شیشه‌ای (Glassmorphism Card) */
        .glass-card {
            background: rgba(255, 255, 255, 0.15); /* شفافیت پایه */
            backdrop-filter: blur(15px); /* جلوه بلور */
            -webkit-backdrop-filter: blur(15px); /* برای سازگاری با سافاری */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 3. فرم‌ها و استایل‌های داخلی */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            color: white;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3); /* رنگ ورودی کمی مات */
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: background 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px var(--glow-color);
        }
        
        /* استایل پلک‌دار دکمه */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            color: white;
            /* گرادینت و افکت نئونی دکمه */
            background: linear-gradient(45deg, var(--glow-color), #009dff);
            box-shadow: 0 5px 15px rgba(76, 154, 255, 0.5);
            transition: all 0.3s ease;
        }

        button:hover {
            box-shadow: 0 8px 25px rgba(76, 154, 255, 0.8);
            transform: translateY(-2px);
        }

        /* 4. لینک جابجایی فرم */
        .toggle-link {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s;
        }

        .toggle-link:hover {
            color: white;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="glass-card">
        
        <!-- فرم ورود (Login Form) -->
        <div id="loginForm" class="form-section active">
            <h2>ورود به حساب کاربری</h2>
            <p class="subtitle">لطفاً اطلاعات خود را وارد کنید.</p>
            
            <form onsubmit="handleFormSubmit(event, 'login')">
                <div class="input-group">
                    <input type="email" placeholder="ایمیل" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="رمز عبور" required>
                </div>
                <button type="submit">ورود</button>
            </form>
            
            <div class="toggle-link" onclick="toggleForm('signup')">
                حساب کاربری ندارید؟ <strong>ثبت‌نام کنید</strong>
            </div>
        </div>

        <!-- فرم ثبت‌نام (Signup Form) -->
        <div id="signupForm" class="form-section">
            <h2>ایجاد حساب جدید</h2>
            <p class="subtitle">فقط چند قدم تا عضویت.</p>

            <form onsubmit="handleFormSubmit(event, 'signup')">
                <div class="input-group">
                    <input type="text" placeholder="نام کامل" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="ایمیل" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="رمز عبور" required>
                </div>
                <button type="submit">ثبت‌نام</button>
            </form>
            
            <div class="toggle-link" onclick="toggleForm('login')">
                قبلاً ثبت‌نام کرده‌اید؟ <strong>وارد شوید</strong>
            </div>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        /**
         * تابع اصلی برای جابجایی بین فرم‌ها با افکت محو شدن
         * @param {string} formName - 'login' یا 'signup'
         */
        function toggleForm(formName) {
            // 1. غیرفعال کردن هر دو فرم و آماده‌سازی برای انیمیشن
            loginForm.classList.remove('active');
            signupForm.classList.remove('active');

            // استفاده از setTimeout برای اطمینان از اجرای انیمیشن خروج قبل از تغییر نمایش
            setTimeout(() => {
                if (formName === 'login') {
                    loginForm.classList.add('active');
                } else {
                    signupForm.classList.add('active');
                }
            }, 100); // 100ms برای فاصله زمانی کوتاه
        }

        /**
         * مدیریت ارسال فرم
         * @param {Event} event - رویداد ارسال
         * @param {string} type - نوع فرم ('login' یا 'signup')
         */
        function handleFormSubmit(event, type) {
            event.preventDefault(); // جلوگیری از رفرش صفحه
            
            // شبیه‌سازی فرایند ارسال
            const button = event.target.querySelector('button');
            button.textContent = 'در حال پردازش...';
            button.disabled = true;

            setTimeout(() => {
                alert(`فرم ${type === 'login' ? 'ورود' : 'ثبت‌نام'} با موفقیت انجام شد! (این یک شبیه‌سازی است)`);
                
                // بازگرداندن وضعیت دکمه
                button.textContent = type === 'login' ? 'ورود' : 'ثبت‌نام';
                button.disabled = false;

                // در صورت موفقیت در ثبت نام، معمولا به صفحه ورود هدایت می شود.
                if (type === 'signup') {
                    toggleForm('login');
                }
            }, 1500);
        }
    </script>

</body>
</html>
